name: Release stable image
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact upstream version without v (empty = current stable)'
        type: string
      force:
        description: Rebuild even if already published (for packaging/security updates)
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      force:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-stable
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
      packages: write
      security-events: write
      id-token: write
    uses: ./.github/workflows/release-image.yml
    with:
      channel: stable
      version: ${{ inputs.version }}
      force: ${{ inputs.force }}
