name: Release Helm chart
on:
  push:
    tags: ['chart-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-chart
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-dev.txt
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Test chart and verify release tag
        run: |
          bash scripts/test-chart.sh
          version=$(helm show chart charts/t3-code | awk '$1 == "version:" {print $2}')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "chart-v$version" ]]; then
            echo 'Chart.yaml version does not match tag' >&2; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "REGISTRY_PATH=ghcr.io/${GITHUB_REPOSITORY,,}/charts" >> "$GITHUB_ENV"
      - name: Package and publish chart to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package charts/t3-code --destination dist
          helm push "dist/t3-code-$VERSION.tgz" "oci://$REGISTRY_PATH" 2> push.log
          cat push.log
          digest=$(awk '$1 == "Digest:" {print $2}' push.log)
          test -n "$digest"
          # Cosign uses Docker's credential store, not Helm's.
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "$REGISTRY_PATH/t3-code@$digest"
          (cd dist && sha256sum "t3-code-$VERSION.tgz" > SHA256SUMS)
          # Markdown backticks are literal formatting.
          # shellcheck disable=SC2016
          printf 'OCI chart: `%s/t3-code:%s`\nDigest: `%s`\n' "$REGISTRY_PATH" "$VERSION" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish downloadable chart alongside OCI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="chart-v$VERSION"
          # Markdown backticks are literal formatting.
          # shellcheck disable=SC2016
          printf 'Install: `helm install t3 oci://%s/t3-code --version %s --set image.repository=ghcr.io/%s`\n' \
            "$REGISTRY_PATH" "$VERSION" "${GITHUB_REPOSITORY,,}" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Helm chart $VERSION" --notes-file notes.md \
              --target "$GITHUB_SHA" --latest=false
          fi
